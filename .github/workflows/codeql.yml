# Code scanning (CodeQL) of the JavaScript sources on every push / pull request to main and weekly.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config: |
            paths: [src, tools]
            paths-ignore: [tools/node_modules, AIXM-Code-Converter.html]
      - uses: github/codeql-action/analyze@v4
