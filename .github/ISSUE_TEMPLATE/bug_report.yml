name: Bug report
description: Something does not work or shows wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you! Please do not attach confidential State data — describe the problem or use a small sample."
  - type: input
    id: version
    attributes: { label: Version, description: "Shown in the top bar, e.g. v1.2.1", placeholder: v1.2.1 }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and operating system, placeholder: "Chrome 140 on Windows 11" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, the AIP section / feature, what you expected" }
    validations: { required: true }
  - type: input
    id: aixm
    attributes: { label: AIXM version and file size, placeholder: "AIXM 5.1.1, 800 MB" }
